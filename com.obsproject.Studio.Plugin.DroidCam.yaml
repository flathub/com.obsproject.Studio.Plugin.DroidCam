id: com.obsproject.Studio.Plugin.DroidCam
branch: stable
runtime: com.obsproject.Studio
runtime-version: stable
sdk: org.kde.Sdk//6.5
build-extension: true
separate-locales: false
appstream-compose: false

finish-args:
  - --filesystem=/run/usbmuxd:ro

build-options:
  prefix: /app/plugins/DroidCam
  append-ld-library-path: /app/plugins/DroidCam/lib
  append-pkg-config-path: /app/plugins/DroidCam/lib

modules:
  - name: libplist
    cleanup:
      - /bin
      - /include
      - /lib/debug
      - /lib/libplist++*
      - /lib/pkgconfig
      - /share/man
      - '*.la'
    config-opts:
      - --without-cython
      - --disable-static
      - --without-tests
    sources:
      - type: archive
        url: "https://github.com/libimobiledevice/libplist/releases/download/2.2.0/libplist-2.2.0.tar.bz2"
        sha1: a92830a3286442f9ea2eac02db81fcfb149a0812

  - name: libusbmuxd
    cleanup:
      - /bin
      - /include
      - /lib/debug
      - /lib/pkgconfig
      - /share/man
      - '*.la'
    config-opts:
      - --disable-static
      - --without-tests
    sources:
      - type: archive
        url: "https://github.com/libimobiledevice/libusbmuxd/releases/download/2.0.2/libusbmuxd-2.0.2.tar.bz2"
        sha1: e3c2c846471ba7c171c01d87cb37d379d53d5f02

  - name: droidcam-obs
    buildsystem: simple
    build-commands:
      - install -pD -t ${FLATPAK_DEST}/lib/obs-plugins                            bin/64bit/*
      - install -pD -t ${FLATPAK_DEST}/share/obs/obs-plugins/droidcam-obs/locale  data/locale/*
    sources:
      - type: file
        path: com.obsproject.Studio.Plugin.DroidCam.metainfo.xml

      - type: archive
        url: "https://github.com/dev47apps/droidcam-obs-plugin/releases/download/2.4.0/droidcam_obs_2.4.0_linux_flatpak.zip"
        sha256: 2f5ad8eded1b3d46bf23300591b2dab13264a9f71a1836efe0d3fdae56ef57c7

    post-install:
      - install -Dm644 --target-directory=${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
      - appstream-compose --basename=${FLATPAK_ID} --prefix=${FLATPAK_DEST} --origin=flatpak ${FLATPAK_ID}
